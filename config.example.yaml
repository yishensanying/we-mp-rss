# 运行环境配置（环境变量，不在此文件中生效，它控制的是"是否从 disconf 加载 config.yaml"这个前置决策，在 config.yaml 被读取之前就要生效）
# APP_ENV: dev 跳过Disconf远程加载，直接使用本地config.yaml；prod(默认) 从Disconf加载配置

app_name: ${APP_NAME:-we-mp-rss}
server:
   #服务名称
   name: ${SERVER_NAME:-we-mp-rss}
   #前端显示名称
   web_name: ${WEB_NAME:-WeRSS微信公众号订阅助手}
   #过期是否发送授权二维通知 默认True
   send_code: ${SEND_CODE:-True}
   #二维通知标题
   code_title: ${CODE_TITLE:-微信公众号授权过期失效}
   #启动JOB定时任务，默认为True
   enable_job: ${ENABLE_JOB:-True}
   #代码修改自动重启服务，默认为False
   auto_reload: ${AUTO_RELOAD:-False}
   #最大线程数 默认2个线程，不建议超过4个线程
   threads: ${THREADS:-2}
   #通过web方式授权二维码 默认False 
   auth_web: ${WERSS_AUTH_WEB:-True}


#数据库连接配置
#支持的数据库类型: sqlite / mysql / postgresql / oracle
db:
  # 数据库类型
  type: ${DB_TYPE:-oracle}
  # 数据库URL（含主机、端口、库名/服务名）
  # sqlite示例: data/db.db
  # mysql示例: localhost:3306/we-rss?charset=utf8mb4
  # postgresql示例: localhost:5432/we-rss
  # oracle简单格式（测试环境）: oracledbhost:1521/AMDB  (oracledbhost 由 CCE hostAliases 解析)
  # oracle ADDRESS_LIST格式（生产环境）: (DESCRIPTION=(FAILOVER=ON)(LOAD_BALANCE=OFF)(CONNECT_TIMEOUT=3)(RETRY_COUNT=3)(ADDRESS_LIST=(ADDRESS=(PROTOCOL=TCP)(HOST=ctidcam-scan)(PORT=1521))(ADDRESS=(PROTOCOL=TCP)(HOST=cuidcam-scan)(PORT=1521)))(CONNECT_DATA=(SERVICE_NAME=amdbsvc)))
  url: ${DB_URL:-oracledbhost:1521/AMDB}
  user: ${DB_USER:-xnnsu}
  # 密码支持明文或 encrypt_ 前缀的加密格式（Blowfish），如: encrypt_50d2240511c02484
  password: ${DB_PASSWORD:-xnnsu}
#Redis 连接配置，用于缓存 Token 等数据，可选配置
#支持 standalone（单机）和 sentinel（哨兵）两种部署模式
#推荐使用分字段配置，避免 URL 编码问题（密码中可以直接包含 @、: 等字符）
redis:
  # 部署模式: standalone（默认，单机直连） / sentinel（哨兵模式）
  deploy_mode: ${REDIS_DEPLOY_MODE:-standalone}
  # ---- standalone 模式配置 ----
  # Redis 主机名或 IP（standalone 模式必填，sentinel 模式可留空）
  # redishost 由 CCE hostAliases 解析，生产环境使用 sentinel 模式可留空
  host: ${REDIS_HOST:-redishost}
  # Redis 端口，默认 6379
  port: ${REDIS_PORT:-6379}
  # ---- sentinel 模式配置 ----
  # 哨兵节点列表，逗号分隔，格式: host1:port1,host2:port2,host3:port3
  sentinel_hosts: ${REDIS_SENTINEL_HOSTS:-}
  # 哨兵 master 名称，默认 mymaster
  master_name: ${REDIS_MASTER_NAME:-mymaster}
  # ---- 通用配置 ----
  # Redis 数据库索引，默认 0
  db: ${REDIS_DB:-0}
  # Redis 密码，留空表示无密码
  password: ${REDIS_PASSWORD:-redis@gfjj12#$}
  # 是否启用 SSL（rediss），可选 True/False，默认 False
  ssl: ${REDIS_SSL:-False}
  # Socket 超时（秒），默认 5
  socket_timeout: ${REDIS_SOCKET_TIMEOUT:-5}
  # 连接超时（秒），默认 5
  connect_timeout: ${REDIS_CONNECT_TIMEOUT:-5}
#通知
notice:
  #通知方式，可选dingding、wechat、feishu、custom
  dingding: "${DINGDING_WEBHOOK}"
  wechat: "${WECHAT_WEBHOOK:-https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=4a6721bf-7183-40f1-875f-fd1ec202db66}"
  feishu: "${FEISHU_WEBHOOK}"
  custom: "${CUSTOM_WEBHOOK}"
  
secret: ${SECRET_KEY:-we-mp-rss}
user_agent: ${USER_AGENT:-Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36/WeRss}

#定时任务执行每篇稿件间隔时间 单位秒 默认10s 允许值 1-60秒之间
interval: ${SPAN_INTERVAL:- 10}

webhook:
  #文章内容的发送格式(默认使用html格式，可选text、markdown)
  content_format: ${WEBHOOK.CONTENT_FORMAT:-html}
  
#API服务端口
port: ${PORT:-8001}
#调试模式
debug: ${DEBUG:-False}


#最大页数 第一次添加 采集的页数默认5页
max_page: ${MAX_PAGE:-5}

#登录会话有效时长 单位分钟 默认4320分钟 3天
token_expire_minutes: ${TOKEN_EXPIRE_MINUTES:-4320}

cache:
  #缓存目录，默认为./data/cache
  dir: ${CACHE.DIR:-./data/cache}
  #是否启用缓存，默认为True
  enabled: ${CACHE.ENABLED:-True}
  #缓存过期时间，默认为3600秒（1小时）
  ttl: ${CACHE.TTL:-3600}
  #视图缓存配置
  views:
    #是否启用视图缓存，默认为True
    enabled: ${CACHE.VIEWS.ENABLED:-False}
    #视图缓存目录，默认为./data/cache/views
    dir: ${CACHE.VIEWS.DIR:-./data/cache/views}
    #视图缓存过期时间，默认为1800秒（30分钟）
    ttl: ${CACHE.VIEWS.TTL:-1800}

article:
  #是否真实删除文章，默认False，如果为True，则会删除数据库中的记录
  true_delete: ${ARTICLE.TRUE_DELETE:-False}

gather:
  #是否采集内容  默认False
  content: ${GATHER.CONTENT:-True}
  #采集模式，web模式（可采集到发布链接)，api模式（可采集临时链接），app模式（采集最新消息）
  model: ${GATHER.MODEL:-web}
  #是否自动检查未采集文章内容，默认False
  content_auto_check: ${GATHER.CONTENT_AUTO_CHECK:-True}
  #自动检查未采集文章内容的时间间隔 单位秒默认59分钟 允许值 1-59分钟之间 默认59分钟
  content_auto_interval: ${GATHER.CONTENT_AUTO_INTERVAL:-15}
  #内容修正模式，默认web 允许值 web、api
  content_mode: ${GATHER.CONTENT_MODE:-web}
  #是否清理html标签 默认True 
  clean_html: ${GATHER.CLEAN_HTML:-False}
  #浏览器类型 默认firefox 允许值 firefox/edge/webkit
  browser_type: ${BROWSER_TYPE:-firefox}
#安全配置
safe:
    # 需要隐藏的配置信息，用逗号分隔 如：db,secret,token等 
    hide_config: "${SAFE_HIDE_CONFIG:-db,secret,token,notice.wechat,notice.feishu,notice.dingding}"
    # 授权加密KEY
    lic_key: "${SAFE_LIC_KEY:-RACHELOS}"
# 微信账号配置
wechat:
  # 允许切换的账号ID列表，为空表示允许所有账号，用逗号分隔
  # 例如: "account1,account2,account3" 或留空 ""
  allowed_accounts: "${WECHAT_ALLOWED_ACCOUNTS:-}"
log:
  #日志文件路径，默认为空字符串，表示不输出到文件。如果要输出到文件，可以指定一个路径如：/var/log/we-mp-rss.log 如果为空就不纪录
   file: ${LOG_FILE:-./log/we-mp-rss.log}
  #日志级别，默认为INFO，可选DEBUG, INFO, WARNING, ERROR, CRITICAL
   level: ${LOG_LEVEL:-DEBUG}
export:
   pdf: 
    #是否启用PDF导出功能 默认False
    enable: ${EXPORT_PDF:-False}
    #PDF导出目录 默认./data/pdf
    dir: ${EXPORT_PDF_DIR:-./data/pdf}
   markdown:
    #是否启用markdown导出功能 默认False
    enable: ${EXPORT_MARKDOWN:-True}
    #markdown导出目录 默认./data/markdown
    dir: ${EXPORT_MARKDOWN_DIR:-./data/markdown}


site:
  name: ${SITE_NAME:-WeRss}
  description: ${SITE_DESCRIPTION:-微信公众号订阅助手}
  keywords: ${SITE_KEYWORDS:-}