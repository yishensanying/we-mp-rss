# 是否启动disconf
# true(默认)会从远程获取配置 false则直接获取本地配置
disconf.enable.remote.conf=true

# 配置服务器的 HOST,用逗号分隔
disconf.conf_server_host=disconf:8016

# 版本, 请采用 X_X_X_X 格式
disconf.version=release

# APP 请采用 产品线_服务名 格式
disconf.app=gfwemprss

# 环境
disconf.env=prod

# 调试时true, 线上环境false
disconf.debug=false

# 忽略哪些分布式配置，用逗号分隔
disconf.ignore=

# 获取远程配置 重试次数，默认是3次
disconf.conf_server_url_retry_times=3

# 获取远程配置 重试时休眠时间，默认是5秒
disconf.conf_server_url_retry_sleep_seconds=5

# 用户指定的下载文件夹, 远程文件下载后会放在这里
disconf.user_define_download_dir=./disconf/download
